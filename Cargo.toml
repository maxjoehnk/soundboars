[package]
name = "soundboars"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.89"
description = "A PipeWire soundboard that injects sounds into voice chat applications"
publish = false

[dependencies]
bytemuck = "1"
pipewire = { version = "0.10", features = ["v0_3_49"] }
thiserror = "2"

[dev-dependencies]
anyhow = "1"
ashpd = { version = "0.14", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
print_stdout = "warn"
